<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚽ Math Soccer – Tilt Your Head to Score!</title>
  <meta name="description" content="A fun webcam-powered math soccer game for 2nd graders." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    /* ============================================================
       RESET & TOKENS
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --card-a:       #C8E6FA;
      --card-b:       #FADADD;
      --accent-a:     #1565C0;
      --accent-b:     #C62828;
      --gold:         #FFD700;
      --panel-bg:     #FFFDE7;
      --shadow:       rgba(0,0,0,0.18);
      --font-main:    'Nunito', sans-serif;
      --font-disp:    'Fredoka One', cursive;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: var(--font-main);
      background: #111;
    }

    /* ============================================================
       16:9 LETTERBOX WRAPPER
    ============================================================ */
    #game-wrapper {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #111;
    }

    #game-canvas {
      position: relative;
      width:  min(100vw, 177.78vh);
      height: min(100vh, 56.25vw);
      display: grid;
      /* rows: top-bar | pitch | bottom-bar */
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 0 60px rgba(0,0,0,0.7);
    }

    /* ── Background: sky → grass ── */
    #game-canvas::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        #87CEEB 0%, #B8E4F9 50%,
        #7DC44E 50%, #5CB033 56%,
        #4CAF50 100%);
      z-index: 0;
    }

    /* ── Grass stripe overlay ── */
    #game-canvas::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 50%;
      background: repeating-linear-gradient(
        90deg,
        transparent 0%, transparent 5.88%,
        rgba(255,255,255,0.055) 5.88%, rgba(255,255,255,0.055) 11.76%
      );
      z-index: 1; pointer-events: none;
    }

    /* ============================================================
       CLOUDS
    ============================================================ */
    .cloud {
      position: absolute; background: #fff;
      border-radius: 50px; opacity: 0.9; z-index: 2;
      animation: floatCloud linear infinite;
    }
    .cloud::before, .cloud::after {
      content: ''; position: absolute;
      background: #fff; border-radius: 50%;
    }
    .c1 { width:100px;height:32px; top:5%;  left:-120px; animation-duration:24s; }
    .c1::before { width:54px;height:44px; top:-22px;left:12px; }
    .c1::after  { width:38px;height:32px; top:-16px;left:46px; }
    .c2 { width:145px;height:42px; top:11%; left:-170px; animation-duration:34s; animation-delay:-14s; }
    .c2::before { width:78px;height:60px; top:-30px;left:18px; }
    .c2::after  { width:56px;height:44px; top:-22px;left:72px; }
    .c3 { width:82px;height:26px; top:3%;  left:-100px; animation-duration:28s; animation-delay:-7s; }
    .c3::before { width:44px;height:36px; top:-18px;left:8px; }
    .c3::after  { width:32px;height:26px; top:-12px;left:36px; }
    @keyframes floatCloud {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(100vw + 250px)); }
    }

    /* Flowers */
    .flowers {
      position: absolute; bottom: 31%; z-index: 3;
      font-size: clamp(14px, 2vw, 24px);
      pointer-events: none; user-select: none;
    }
    .fl-l { left: 1.2%; }
    .fl-r { right: 1.2%; }

    /* ============================================================
       MUTE BUTTON
    ============================================================ */
    #mute-btn {
      position: absolute; top: clamp(8px,1.2vh,14px); right: clamp(10px,1.5vw,18px);
      z-index: 40;
      background: rgba(255,255,255,0.88);
      border: 2px solid #90CAF9;
      border-radius: 50%;
      width:  clamp(30px,4.5vh,48px);
      height: clamp(30px,4.5vh,48px);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(14px,2.4vh,26px);
      box-shadow: 0 3px 10px rgba(0,0,0,0.22);
      transition: transform 0.15s, background 0.2s;
    }
    #mute-btn:hover { transform: scale(1.1); background: #fff; }

    /* ============================================================
       TOP BAR
    ============================================================ */
    #top-bar {
      position: relative; z-index: 10;
      display: flex; align-items: center;
      gap: 10px;
      padding: clamp(6px,1vh,12px) clamp(10px,1.8vw,22px);
      /* leave space for mute btn on right */
      padding-right: clamp(52px,7vw,80px);
    }

    /* Score card */
    #score-card {
      background: var(--panel-bg);
      border: 3px solid var(--gold);
      border-radius: 16px;
      box-shadow: 0 4px 12px var(--shadow);
      padding: 4px 12px;
      display: flex; align-items: center; gap: 7px;
      flex-shrink: 0; min-width: 96px;
    }
    #score-card .trophy { font-size: clamp(16px,2.5vh,32px); }
    .sc-text { display: flex; flex-direction: column; align-items: center; }
    .sc-label { font-size: clamp(7px,0.9vh,12px); font-weight:800; color:#6D4C41; text-transform:uppercase; }
    #score-num {
      font-family: var(--font-disp);
      font-size: clamp(22px,3.6vh,46px);
      color: var(--accent-a); line-height:1;
      transition: transform 0.25s;
    }

    /* Question banner – made taller/bolder */
    #question-banner {
      flex: 1;
      background: rgba(255,255,255,0.95);
      border: 3px solid #FFD54F;
      border-radius: 20px;
      box-shadow: 0 4px 18px var(--shadow);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 6px 18px;
      min-height: clamp(42px,6.5vh,70px);
    }
    .star-icon { font-size: clamp(14px,2.2vh,28px); }
    #question-text {
      font-family: var(--font-disp);
      font-size: clamp(22px,4.2vh,58px);
      color: #3E2723; text-align: center;
      letter-spacing: 0.5px;
    }

    /* Q counter */
    #q-counter {
      background: linear-gradient(135deg,#1565C0,#1E88E5);
      color: #fff; font-weight: 800;
      font-size: clamp(10px,1.4vh,18px);
      padding: 5px 14px; border-radius: 20px;
      white-space: nowrap; flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(21,101,192,0.38);
    }

    /* ============================================================
       CENTER – PITCH
    ============================================================ */
    #pitch-section {
      position: relative; z-index: 5;
      display: flex; align-items: flex-end; justify-content: center;
    }

    /* ── GOALPOST ─────────────────────────────────────────────
       Now wider (70%) and anchored at the top of the pitch section
       with its base sitting ON the grass line.
    ──────────────────────────────────────────────────────────── */
    #goalpost-wrap {
      position: absolute;
      /* sit at top, overflow slightly into sky */
      top: -2%;
      left: 50%; transform: translateX(-50%);
      /* WIDER & LARGER: was 38%, now 70% */
      width: clamp(280px, 70%, 900px);
      z-index: 3;
    }
    #goalpost-svg { width: 100%; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.22)); }
    .net-v, .net-h { fill:none; stroke:rgba(180,210,255,0.6); stroke-width:1.5; }

    /* ── GOALKEEPER ─────────────────────────────────────────── */
    #goalkeeper {
      position: absolute;
      /* bottom of pitch-section, on the grass */
      bottom: 22%;
      left: 50%; transform: translateX(-50%);
      width: clamp(64px, 10%, 134px);
      z-index: 6; user-select: none;
    }
    #goalkeeper.idle      { animation: gkIdle     2.5s ease-in-out infinite; }
    #goalkeeper.diveL     { animation: gkDiveLeft  0.45s ease-out forwards; }
    #goalkeeper.diveR     { animation: gkDiveRight 0.45s ease-out forwards; }
    #goalkeeper.celebrate { animation: gkCelebrate 0.55s ease-in-out 3; }

    @keyframes gkIdle      { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-6px)} }
    @keyframes gkDiveLeft  { 0%{transform:translateX(-50%)} 70%{transform:translateX(calc(-50% - 70px)) rotate(-28deg)} 100%{transform:translateX(calc(-50% - 70px)) rotate(-28deg)} }
    @keyframes gkDiveRight { 0%{transform:translateX(-50%)} 70%{transform:translateX(calc(-50% + 70px)) rotate(28deg)}  100%{transform:translateX(calc(-50% + 70px)) rotate(28deg)}  }
    @keyframes gkCelebrate { 0%,100%{transform:translateX(-50%) rotate(0)} 25%{transform:translateX(-50%) rotate(-14deg) scale(1.1)} 75%{transform:translateX(-50%) rotate(14deg) scale(1.1)} }

    /* ── SOCCER BALL ─────────────────────────────────────────── */
    #ball {
      position: absolute;
      bottom: 6%; left: 50%;
      transform: translateX(-50%);
      width: clamp(34px, 5.5%, 74px);
      z-index: 7; user-select: none;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,0.32));
    }
    #ball.kicked {
      transition: transform 0.55s cubic-bezier(0.25,0.46,0.45,0.94),
                  opacity   0.55s ease;
    }

    /* ── FEEDBACK LABEL ──────────────────────────────────────── */
    #feedback-label {
      position: absolute;
      top: 30%; left: 50%;
      transform: translate(-50%,-50%) scale(0);
      font-family: var(--font-disp);
      font-size: clamp(30px,7vw,90px);
      color: #fff;
      text-shadow: 0 0 24px rgba(255,220,0,0.9), 3px 3px 0 #BF360C;
      z-index: 20; pointer-events: none;
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      white-space: nowrap;
    }
    #feedback-label.show { transform:translate(-50%,-50%) scale(1); opacity:1; }
    #feedback-label.hide { transform:translate(-50%,-50%) scale(0.4); opacity:0; }

    /* ── CONFETTI CANVAS ─────────────────────────────────────── */
    #confetti-canvas {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 25;
    }

    /* ============================================================
       BOTTOM BAR  – enlarged cards + webcam
    ============================================================ */
    #bottom-bar {
      position: relative; z-index: 10;
      background: linear-gradient(180deg,rgba(255,252,230,0) 0%,rgba(255,252,230,0.96) 20%);
      display: flex; align-items: center; justify-content: center;
      gap: clamp(8px,1.5vw,22px);
      padding: clamp(6px,1vh,14px) clamp(10px,2vw,28px) clamp(8px,1.3vh,18px);
    }

    /* Answer Cards — enlarged */
    .answer-card {
      flex: 1;
      /* was 21%, now 26% for more prominence */
      max-width: clamp(130px, 26%, 320px);
      aspect-ratio: 4/3;
      border-radius: 24px;
      border: 4px solid transparent;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px;
      box-shadow: 0 6px 18px var(--shadow);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      position: relative; cursor: default;
    }
    #card-a { background: var(--card-a); border-color: #90CAF9; }
    #card-b { background: var(--card-b); border-color: #F48FB1; }

    .card-letter {
      font-family: var(--font-disp);
      font-size: clamp(32px,6.2vh,80px);
      line-height: 1;
    }
    #card-a .card-letter { color: var(--accent-a); }
    #card-b .card-letter { color: var(--accent-b); }
    .card-value {
      font-family: var(--font-disp);
      font-size: clamp(22px,4.2vh,56px);
      color: #4E342E; line-height: 1;
    }
    .card-star {
      position: absolute; top:-12px; right:-10px;
      font-size: clamp(16px,2.6vh,32px);
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
    }
    .answer-card.highlight { transform: scale(1.1); }
    #card-a.highlight { border-color:var(--accent-a); box-shadow:0 0 0 4px rgba(21,101,192,0.28),0 10px 28px rgba(0,0,0,0.22); }
    #card-b.highlight { border-color:var(--accent-b); box-shadow:0 0 0 4px rgba(198,40,40,0.28),0 10px 28px rgba(0,0,0,0.22); }

    /* ── WEBCAM CIRCLE — enlarged ──────────────────────────── */
    #cam-container {
      position: relative;
      /* was 11vw, now 14vw */
      width: clamp(100px, 14vw, 188px);
      aspect-ratio: 1;
      flex-shrink: 0;
    }



    #progress-ring-svg {
      position: absolute; inset:-8px;
      width:calc(100% + 16px); height:calc(100% + 16px);
      transform:rotate(-90deg);
      pointer-events:none; z-index:15;
    }
    #progress-ring-bg   { fill:none; stroke:rgba(255,255,255,0.22); stroke-width:8; }
    #progress-ring-fill {
      fill:none; stroke:#FFD700; stroke-width:8; stroke-linecap:round;
      stroke-dasharray:0 1000;
      transition:stroke-dasharray 0.06s linear;
      filter:drop-shadow(0 0 6px rgba(255,215,0,0.85));
    }

    #cam-clip {
      width:100%; height:100%;
      border-radius:50%; overflow:hidden;
      border:4px solid #fff;
      box-shadow:0 5px 18px var(--shadow);
      background:#222; position:relative; z-index:10;
    }
    #webcam { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }

    #cam-icon {
      position:absolute; bottom:-9px; left:50%; transform:translateX(-50%);
      background:var(--accent-a); color:#fff; border-radius:50%;
      width:clamp(22px,3.4vh,34px); height:clamp(22px,3.4vh,34px);
      display:flex; align-items:center; justify-content:center;
      font-size:clamp(11px,1.7vh,17px);
      box-shadow:0 3px 8px rgba(0,0,0,0.3); z-index:16;
    }
    #cam-hint {
      position:absolute; bottom:110%; left:50%; transform:translateX(-50%);
      white-space:nowrap;
      font-size:clamp(8px,1.1vh,13px); font-weight:700; color:#5D4037;
      background:rgba(255,253,231,0.92);
      padding:3px 9px; border-radius:10px;
      box-shadow:0 2px 6px var(--shadow); pointer-events:none;
    }

    /* ============================================================
       STATUS / CAM ERROR
    ============================================================ */
    #status-msg {
      position:absolute; bottom:5px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.52); color:#fff;
      font-size:clamp(8px,1vh,12px);
      padding:3px 10px; border-radius:8px; white-space:nowrap;
      z-index:30; pointer-events:none;
    }
    #cam-error {
      position:absolute; inset:0;
      background:rgba(180,0,0,0.82); color:#fff;
      display:none; align-items:center; justify-content:center;
      text-align:center; padding:8px;
      border-radius:50%;
      font-size:clamp(8px,1.2vh,13px); font-weight:700; z-index:20;
    }

    /* ============================================================
       MODALS
    ============================================================ */
    #start-overlay, #end-overlay {
      position:absolute; inset:0;
      background:rgba(8,8,35,0.82);
      display:flex; align-items:center; justify-content:center;
      z-index:50; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    }
    .modal-box {
      background:var(--panel-bg);
      border-radius:30px; border:5px solid var(--gold);
      box-shadow:0 0 50px rgba(255,215,0,0.38);
      padding:clamp(18px,3.5vh,46px) clamp(24px,4.5vw,64px);
      text-align:center; max-width:88%;
      animation:popIn 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes popIn { from{transform:scale(0.45);opacity:0} to{transform:scale(1);opacity:1} }
    .modal-box .emoji-big { font-size:clamp(32px,7.5vh,76px); }
    .modal-box h1 { font-family:var(--font-disp); font-size:clamp(22px,4.5vh,56px); color:#1565C0; margin:8px 0 5px; }
    .modal-box p  { font-size:clamp(12px,2vh,22px); color:#5D4037; margin-bottom:14px; font-weight:700; }
    .final-score  { font-family:var(--font-disp); font-size:clamp(26px,5.5vh,68px); color:#E65100; margin:6px 0 14px; }
    .stars-row    { font-size:clamp(18px,3.2vh,42px); letter-spacing:4px; margin:8px 0; }
    .btn-play {
      background:linear-gradient(135deg,#43A047,#1B5E20);
      color:#fff; border:none; border-radius:50px;
      font-family:var(--font-disp);
      font-size:clamp(14px,2.8vh,34px);
      padding:clamp(9px,1.8vh,20px) clamp(24px,4.5vw,56px);
      cursor:pointer;
      box-shadow:0 6px 20px rgba(27,94,32,0.4);
      transition:transform 0.15s, box-shadow 0.15s;
    }
    .btn-play:hover  { transform:scale(1.06); box-shadow:0 10px 30px rgba(27,94,32,0.5); }
    .btn-play:active { transform:scale(0.97); }

    /* ============================================================
       LOADING SCREEN
    ============================================================ */
    #loading-screen {
      position:absolute; inset:0;
      background:linear-gradient(135deg,#1565C0,#0D47A1);
      z-index:60; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:16px; color:#fff;
    }
    .spinner {
      width:52px; height:52px;
      border:6px solid rgba(255,255,255,0.3); border-top-color:#fff;
      border-radius:50%; animation:spin 0.85s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
    #loading-screen h2 { font-family:var(--font-disp); font-size:clamp(18px,3vh,36px); }
    #loading-screen p  { font-size:clamp(11px,1.7vh,19px); opacity:0.8; }

    .hidden { display:none !important; }
  </style>
</head>
<body>

<div id="game-wrapper">
<div id="game-canvas">

  <!-- Loading -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <h2>⚽ Math Soccer</h2>
    <p>Loading face tracking…</p>
  </div>

  <!-- Decorative -->
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="flowers fl-l">🌸🌼🌺</div>
  <div class="flowers fl-r">🌻🌼🌸</div>

  <!-- Mute toggle -->
  <button id="mute-btn" title="Toggle Music">🔊</button>

  <!-- Confetti -->
  <canvas id="confetti-canvas"></canvas>
  <!-- Feedback label -->
  <div id="feedback-label">⚽ GOAL!</div>

  <!-- ====================================================
       TOP BAR
  ===================================================== -->
  <div id="top-bar">
    <div id="score-card">
      <span class="trophy">🏆</span>
      <div class="sc-text">
        <span class="sc-label">Goals</span>
        <span id="score-num">0</span>
      </div>
    </div>
    <div id="question-banner">
      <span class="star-icon">⭐</span>
      <span id="question-text">Get Ready!</span>
      <span class="star-icon">⭐</span>
    </div>
    <div id="q-counter">★ Q 1/10 ★</div>
  </div>

  <!-- ====================================================
       CENTER – PITCH
  ===================================================== -->
  <div id="pitch-section">

    <!-- LARGE Goalpost SVG — wider, anchored on grass -->
    <div id="goalpost-wrap">
      <svg id="goalpost-svg" viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="pshadow">
            <feDropShadow dx="2" dy="6" stdDeviation="4" flood-opacity="0.2"/>
          </filter>
          <linearGradient id="postG" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#e8e8e8"/>
            <stop offset="45%"  stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#d8d8d8"/>
          </linearGradient>
        </defs>
        <!-- Net background fill -->
        <rect x="26" y="18" width="548" height="234" fill="rgba(180,210,255,0.13)" rx="2"/>
        <!-- Vertical net lines -->
        <line x1="26"  y1="18" x2="26"  y2="252" class="net-v"/>
        <line x1="106" y1="18" x2="106" y2="252" class="net-v"/>
        <line x1="186" y1="18" x2="186" y2="252" class="net-v"/>
        <line x1="266" y1="18" x2="266" y2="252" class="net-v"/>
        <line x1="346" y1="18" x2="346" y2="252" class="net-v"/>
        <line x1="426" y1="18" x2="426" y2="252" class="net-v"/>
        <line x1="506" y1="18" x2="506" y2="252" class="net-v"/>
        <line x1="574" y1="18" x2="574" y2="252" class="net-v"/>
        <!-- Horizontal net lines -->
        <line x1="26" y1="18"  x2="574" y2="18"  class="net-h"/>
        <line x1="26" y1="58"  x2="574" y2="58"  class="net-h"/>
        <line x1="26" y1="98"  x2="574" y2="98"  class="net-h"/>
        <line x1="26" y1="138" x2="574" y2="138" class="net-h"/>
        <line x1="26" y1="178" x2="574" y2="178" class="net-h"/>
        <line x1="26" y1="218" x2="574" y2="218" class="net-h"/>
        <line x1="26" y1="250" x2="574" y2="250" class="net-h"/>
        <!-- LEFT POST -->
        <rect x="14" y="12" width="20" height="244" rx="10" fill="url(#postG)" filter="url(#pshadow)"/>
        <!-- RIGHT POST -->
        <rect x="566" y="12" width="20" height="244" rx="10" fill="url(#postG)" filter="url(#pshadow)"/>
        <!-- CROSSBAR -->
        <rect x="14" y="12" width="572" height="18" rx="9" fill="url(#postG)" filter="url(#pshadow)"/>
        <!-- Crossbar inner shadow -->

============================================================ -->
<script>
'use strict';

/* ============================================================
   ██████╗ ██████╗ ███╗   ██╗███████╗██╗ ██████╗
   CONFIG – all tunable parameters in one place
============================================================ */
const CONFIG = {
  /**
   * Minimum head-roll (degrees) to highlight a card.
   * Increase → harder to trigger (less sensitive).
   * Decrease → small tilt is enough (more sensitive).
   * Recommended range: 12–22 for ages 7–8.
   */
  TILT_THRESHOLD_DEG: 15,

  /**
   * How long (ms) the child must hold the tilt to confirm.
   * Increase to avoid accidental picks; decrease for quicker response.
   */
  HOLD_DURATION_MS: 1500,

  TOTAL_QUESTIONS: 10,
  MAX_ADDEND:      100,   // each addend is 0..MAX_ADDEND
  DISTRACTOR_MAX:    9,   // wrong answer offset ±1..±9
};

/* ============================================================
   STATE
============================================================ */
const state = {
  gameActive:    false,
  questionIndex: 0,
  score:         0,
  correctSide:   null,
  answerLocked:  false,
  tiltSide:      null,
  holdStart:     null,
};

/* ============================================================
   DOM
============================================================ */
const $  = id => document.getElementById(id);
const D  = {
  loading:    $('loading-screen'),
  startOvl:   $('start-overlay'),
  endOvl:     $('end-overlay'),
  qCounter:   $('q-counter'),
  qText:      $('question-text'),
  scoreNum:   $('score-num'),
  ansA:       $('answer-a'),
  ansB:       $('answer-b'),
  cardA:      $('card-a'),
  cardB:      $('card-b'),
  ball:       $('ball'),
  gk:         $('goalkeeper'),
  feedback:   $('feedback-label'),
  webcam:     $('webcam'),
  ringFill:   $('progress-ring-fill'),
  statusMsg:  $('status-msg'),
  btnStart:   $('btn-start'),
  btnReplay:  $('btn-replay'),
  endScore:   $('end-score'),
  endTitle:   $('end-title'),
  endEmoji:   $('end-emoji'),
  endMsg:     $('end-msg'),
  endStars:   $('end-stars'),
  confetti:   $('confetti-canvas'),
  camErr:     $('cam-error'),
  muteBtn:    $('mute-btn'),
};

/* ============================================================
   ██████╗  █████╗ ██████╗ ██╗ ██████╗
  ██╔══██╗██╔══██╗██╔══██╗██║██╔═══██╗
  ███████║██║  ██║██║  ██║██║██║   ██║
  ██╔══██║██║  ██║██║  ██║██║██║   ██║
  ██║  ██║╚█████╔╝██████╔╝██║╚██████╔╝
  ╚═╝  ╚═╝ ╚════╝ ╚═════╝ ╚═╝ ╚═════╝
  Web Audio API — fully self-contained, no external files
============================================================ */
let audioCtx    = null;
let bgMusicNode = null;   // gain node for background music
let bgPlaying   = false;
let isMuted     = false;

/** Lazily create AudioContext on first user gesture */
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

/* ── BACKGROUND MUSIC ─────────────────────────────────────
   A cheerful 8-note looping melody using oscillators.
   Notes: C D E G A (pentatonic, always sounds happy).
──────────────────────────────────────────────────────────── */
const BG_MELODY = [
  // [freq, duration_s, gap_s]
  [523.25, 0.18, 0.04],  // C5
  [587.33, 0.18, 0.04],  // D5
  [659.26, 0.20, 0.04],  // E5
  [783.99, 0.20, 0.04],  // G5
  [880.00, 0.22, 0.06],  // A5
  [783.99, 0.18, 0.04],  // G5
  [659.26, 0.18, 0.04],  // E5
  [523.25, 0.28, 0.14],  // C5

  [392.00, 0.18, 0.04],  // G4
  [440.00, 0.18, 0.04],  // A4
  [523.25, 0.20, 0.04],  // C5
  [659.26, 0.20, 0.04],  // E5
  [587.33, 0.18, 0.04],  // D5
  [523.25, 0.18, 0.04],  // C5
  [440.00, 0.22, 0.06],  // A4
  [392.00, 0.28, 0.18],  // G4
];

let bgScheduleTimeout = null;

function startBackgroundMusic() {
  if (bgPlaying) return;
  bgPlaying = true;
  const ac = getAudioCtx();

  // Master gain for muting without stopping
  bgMusicNode = ac.createGain();
  bgMusicNode.gain.value = isMuted ? 0 : 0.08;
  bgMusicNode.connect(ac.destination);

  scheduleMelody(ac, bgMusicNode, 0);
}

function scheduleMelody(ac, masterGain, startOffset) {
  let t = ac.currentTime + startOffset;
  BG_MELODY.forEach(([freq, dur, gap]) => {
    playBgNote(ac, masterGain, freq, t, dur);
    t += dur + gap;
  });
  // Loop: schedule next loop just before current ends
  const totalDur = BG_MELODY.reduce((s, [,d,g]) => s + d + g, 0);
  bgScheduleTimeout = setTimeout(() => {
    if (bgPlaying) scheduleMelody(ac, masterGain, 0.05);
  }, (totalDur - 0.1) * 1000);
}

function playBgNote(ac, dest, freq, startTime, duration) {
  const osc  = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(1, startTime + 0.02);
  gain.gain.setValueAtTime(1, startTime + duration - 0.03);
  gain.gain.linearRampToValueAtTime(0, startTime + duration);
  osc.connect(gain);
  gain.connect(dest);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.01);
}

function stopBackgroundMusic() {
  bgPlaying = false;
  clearTimeout(bgScheduleTimeout);
  if (bgMusicNode) {
    bgMusicNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
    setTimeout(() => { bgMusicNode = null; }, 400);
  }
}

function setMusicMuted(muted) {
  isMuted = muted;
  D.muteBtn.textContent = muted ? '🔇' : '🔊';
  if (bgMusicNode) {
    bgMusicNode.gain.setTargetAtTime(muted ? 0 : 0.08, audioCtx.currentTime, 0.1);
  }
}

/* ── SFX: GOAL (fanfare) ──────────────────────────────── */
function sfxGoal() {
  const ac  = getAudioCtx();
  const vol = ac.createGain();
  vol.gain.value = isMuted ? 0 : 0.28;
  vol.connect(ac.destination);

  // Rising fanfare: C→E→G→C' sweep
  const notes = [
    [523.25, 0.12], [659.26, 0.12], [783.99, 0.12],
    [1046.5, 0.08], [783.99, 0.08], [1046.5, 0.32],
  ];
  let t = ac.currentTime;
  notes.forEach(([f, d]) => {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.6, t);
    g.gain.linearRampToValueAtTime(0, t + d);
    o.connect(g); g.connect(vol);
    o.start(t); o.stop(t + d + 0.01);
    t += d * 0.85;
  });

  // Cheer-clap texture (white noise bursts)
  for (let i = 0; i < 6; i++) {
    const buf  = ac.createBuffer(1, ac.sampleRate * 0.08, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let j = 0; j < data.length; j++) data[j] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buf;
    const ng = ac.createGain();
    ng.gain.setValueAtTime(0.12, 0);
    ng.gain.linearRampToValueAtTime(0, 0.08);
    const bpf = ac.createBiquadFilter();
    bpf.type = 'bandpass'; bpf.frequency.value = 2200; bpf.Q.value = 0.5;
    src.connect(bpf); bpf.connect(ng); ng.connect(vol);
    src.start(ac.currentTime + i * 0.12);
  }
}

/* ── SFX: MISS / SAVE (gentle "oooh") ────────────────── */
function sfxMiss() {
  const ac  = getAudioCtx();
  const vol = ac.createGain();
  vol.gain.value = isMuted ? 0 : 0.22;
  vol.connect(ac.destination);

  // Descending "aww" tones
  const notes = [
    [440, 0.15], [392, 0.15], [349, 0.15], [330, 0.25],
  ];
  let t = ac.currentTime;
  notes.forEach(([f, d]) => {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.5, t);
    g.gain.linearRampToValueAtTime(0, t + d);
    o.connect(g); g.connect(vol);
    o.start(t); o.stop(t + d + 0.01);
    t += d * 0.9;
  });

  // Soft "whoosh"
  const buf  = ac.createBuffer(1, ac.sampleRate * 0.35, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let j = 0; j < data.length; j++) data[j] = (Math.random() * 2 - 1) * (1 - j / data.length);
  const src = ac.createBufferSource(); src.buffer = buf;
  const lpf = ac.createBiquadFilter(); lpf.type = 'lowpass'; lpf.frequency.value = 800;
  const wg  = ac.createGain(); wg.gain.value = 0.09;
  src.connect(lpf); lpf.connect(wg); wg.connect(vol);
  src.start(ac.currentTime);
}

/* ── MUTE TOGGLE ─────────────────────────────────────── */
D.muteBtn.addEventListener('click', () => {
  getAudioCtx(); // ensure context exists
  setMusicMuted(!isMuted);
});

/* ============================================================
   PROGRESS RING  (r=52 → circumference ≈ 326.73)
============================================================ */
const RING_CIRC = 2 * Math.PI * 52;

function setRing(f) {
  D.ringFill.style.strokeDasharray = `${Math.min(f,1)*RING_CIRC} ${RING_CIRC}`;
}
function clearRing() { D.ringFill.style.strokeDasharray = `0 ${RING_CIRC}`; }

/* ============================================================
   CONFETTI
============================================================ */
const ctx2d = D.confetti.getContext('2d');
let confParts = [], confRaf = null;

function resizeConfetti() {
  const gc = $('game-canvas');
  D.confetti.width  = gc.offsetWidth;
  D.confetti.height = gc.offsetHeight;
}
window.addEventListener('resize', resizeConfetti);
resizeConfetti();

function spawnConfetti() {
  if (confRaf) cancelAnimationFrame(confRaf);
  confParts = [];
  const pal = ['#FFD700','#FF4081','#00BCD4','#76FF03','#FF6D00','#EA80FC','#fff','#FF8A65','#69F0AE'];
  for (let i = 0; i < 130; i++) {
    confParts.push({
      x:    Math.random() * D.confetti.width,
      y:    -20,
      vx:   (Math.random() - 0.5) * 6,
      vy:   Math.random() * 5 + 3,
      rot:  Math.random() * 360,
      rotV: (Math.random() - 0.5) * 9,
      w:    Math.random() * 12 + 5,
      h:    Math.random() * 6  + 4,
      col:  pal[Math.floor(Math.random() * pal.length)],
      life: 1,
    });
  }
  tickConfetti();
}
function tickConfetti() {
  ctx2d.clearRect(0, 0, D.confetti.width, D.confetti.height);
  let alive = false;
  confParts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.rot += p.rotV; p.life -= 0.007;
    if (p.life <= 0 || p.y > D.confetti.height + 20) return;
    alive = true;
    ctx2d.save();
    ctx2d.globalAlpha = Math.max(0, p.life);
    ctx2d.translate(p.x, p.y); ctx2d.rotate(p.rot * Math.PI / 180);
    ctx2d.fillStyle = p.col;
    ctx2d.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx2d.restore();
  });
  if (alive) confRaf = requestAnimationFrame(tickConfetti);
  else ctx2d.clearRect(0, 0, D.confetti.width, D.confetti.height);
}

/* ============================================================
   QUESTION GENERATION
============================================================ */
let currentQ = null;

function genQuestion() {
  // Generates sum (correct answer) within [0, 100]
  const correct = Math.floor(Math.random() * (CONFIG.MAX_ADDEND + 1));
  // Generates a in [0, correct]
  const a = Math.floor(Math.random() * (correct + 1));
  const b = correct - a;

  // wrong answer should also be in [0, 100], and not equal to correct
  let wrong;
  let attempts = 0;
  do {
    let offset = Math.floor(Math.random() * CONFIG.DISTRACTOR_MAX) + 1;
    if (Math.random() < 0.5) offset = -offset;
    wrong = correct + offset;
    attempts++;
  } while ((wrong < 0 || wrong > CONFIG.MAX_ADDEND || wrong === correct) && attempts < 100);

  // Fallback in case loop fails
  if (wrong < 0 || wrong > CONFIG.MAX_ADDEND || wrong === correct) {
    wrong = (correct > 50) ? correct - 5 : correct + 5;
  }

  const correctSide = Math.random() < 0.5 ? 'a' : 'b';
  return {
    a, b, correct, wrong, correctSide,
    displayA: correctSide === 'a' ? correct : wrong,
    displayB: correctSide === 'b' ? correct : wrong,
  };
}

/* ============================================================
   LOAD QUESTION
============================================================ */
function loadQuestion() {
  if (!state.gameActive) return;
  state.answerLocked = false;
  state.tiltSide     = null;
  state.holdStart    = null;
  clearRing();

  currentQ = genQuestion();
  state.correctSide = currentQ.correctSide;

  D.qCounter.textContent = `★ Q ${state.questionIndex + 1}/${CONFIG.TOTAL_QUESTIONS} ★`;
  D.qText.textContent    = `${currentQ.a} + ${currentQ.b} = ?`;
  D.ansA.textContent     = currentQ.displayA;
  D.ansB.textContent     = currentQ.displayB;
  D.cardA.classList.remove('highlight');
  D.cardB.classList.remove('highlight');
  resetScene();
  D.statusMsg.textContent = 'Tilt your head to choose!';
}

/* ============================================================
   RESET BALL & GOALKEEPER
============================================================ */
function resetScene() {
  D.ball.classList.remove('kicked');
  D.ball.style.transform = '';
  D.ball.style.opacity   = '';
  D.gk.className = 'idle';
  D.gk.style.transform = '';
}

/* ============================================================
   FEEDBACK LABEL
============================================================ */
function showFeedback(text, color) {
  D.feedback.textContent = text;
  D.feedback.style.color = color;
  D.feedback.classList.remove('hide');
  D.feedback.classList.add('show');
}
function hideFeedback() {
  D.feedback.classList.remove('show');
  D.feedback.classList.add('hide');
}

/* ============================================================
   KICK BALL
   ─────────────────────────────────────────────────────────
   GOAL path  → ball curves INTO the net (upper-left or upper-right
                quadrant of the goalpost, stays within the frame)
   SAVE path  → ball heads toward the side where GK dives
   MISS path  → ball flies WIDE outside the post (beyond the edge)
============================================================ */
function kickBall(side, outcome) {
  const gc = $('game-canvas');
  const w  = gc.offsetWidth;
  const h  = gc.offsetHeight;

  let xOff, yOff, scale, rot;
  const dir = side === 'a' ? -1 : 1;

  if (outcome === 'goal') {
    // Ball flies into the upper section of the net, slightly off-center
    xOff  = dir * w * 0.18;        // inside the wide goalpost
    yOff  = -h * 0.36;
    scale = 0.5;
    rot   = dir * 300;
  } else if (outcome === 'save') {
    // Ball heads toward the same side as the GK dive (GK blocks it)
    xOff  = dir * w * 0.22;
    yOff  = -h * 0.28;
    scale = 0.55;
    rot   = dir * 240;
  } else {
    // 'miss' — ball flies WIDE past the post
    xOff  = dir * w * 0.52;        // way outside the frame
    yOff  = -h * 0.22;
    scale = 0.45;
    rot   = dir * 360;
  }

  D.ball.classList.add('kicked');
  D.ball.style.transform = `translateX(calc(-50% + ${xOff}px)) translateY(${yOff}px) scale(${scale}) rotate(${rot}deg)`;
  D.ball.style.opacity   = '0.7';
}

/* ============================================================
   GOAL ANIMATION
============================================================ */
function triggerGoal(side) {
  kickBall(side, 'goal');
  sfxGoal();
  setTimeout(() => {
    D.gk.className = 'celebrate';
    showFeedback('⚽ GOAL!', '#FFD700');
    spawnConfetti();
    state.score++;
    D.scoreNum.textContent = state.score;
    D.scoreNum.style.transform = 'scale(1.45)';
    setTimeout(() => { D.scoreNum.style.transform = ''; }, 320);
  }, 440);
  setTimeout(() => { hideFeedback(); nextQuestion(); }, 2800);
}

/* ============================================================
   SAVE / MISS ANIMATION  (wrong answer — randomized)
   50 % → goalkeeper dives and saves
   50 % → ball misses wide (goalkeeper stays center looking confused)
============================================================ */
function triggerIncorrect(side) {
  const isSave = Math.random() < 0.5;
  sfxMiss();

  if (isSave) {
    kickBall(side, 'save');
    setTimeout(() => {
      D.gk.className = side === 'a' ? 'diveL' : 'diveR';
      showFeedback('🧤 Nice Save!', '#FF8A65');
    }, 380);
  } else {
    kickBall(side, 'miss');
    setTimeout(() => {
      // GK stays, shows wide-miss text
      showFeedback('💨 Wide Miss!', '#78909C');
    }, 420);
  }

  setTimeout(() => { hideFeedback(); nextQuestion(); }, 2600);
}

/* ============================================================
   CONFIRM ANSWER
============================================================ */
function confirmAnswer(side) {
  if (state.answerLocked || !state.gameActive) return;
  state.answerLocked = true;
  clearRing();
  D.cardA.classList.remove('highlight');
  D.cardB.classList.remove('highlight');

  if (side === state.correctSide) triggerGoal(side);
  else                             triggerIncorrect(side);
}

/* ============================================================
   NEXT QUESTION / END GAME
============================================================ */
function nextQuestion() {
  state.questionIndex++;
  if (state.questionIndex >= CONFIG.TOTAL_QUESTIONS) endGame();
  else loadQuestion();
}

function endGame() {
  state.gameActive = false;
  stopBackgroundMusic();
  const s = state.score, t = CONFIG.TOTAL_QUESTIONS;
  const pct = s / t;
  let emoji = '💪', title = 'Good Try!', msg = 'Practice makes perfect — try again!';
  if (pct === 1)       { emoji = '🏆🎉'; title = 'PERFECT SCORE!!'; msg = 'You\'re a Math SUPERSTAR! 🌟'; }
  else if (pct >= 0.8) { emoji = '🥇';   title = 'Awesome Job!';    msg = 'You\'re a Math Champion! 🎊'; }
  else if (pct >= 0.6) { emoji = '😊';   title = 'Well Done!';      msg = 'You\'re getting better every kick! 🚀'; }
  else if (pct >= 0.4) { emoji = '💪';   title = 'Keep Going!';     msg = 'Every kick makes you stronger! ⚽'; }
  const starCount = Math.max(1, Math.round(pct * 5));
  D.endEmoji.textContent = emoji;
  D.endTitle.textContent = title;
  D.endScore.textContent = `${s} / ${t} Goals!`;
  D.endMsg.textContent   = msg;
  D.endStars.textContent = '⭐'.repeat(starCount);
  D.endOvl.classList.remove('hidden');
}

/* ============================================================
   START GAME
============================================================ */
function startGame() {
  state.gameActive    = true;
  state.questionIndex = 0;
  state.score         = 0;
  state.answerLocked  = false;
  state.tiltSide      = null;
  state.holdStart     = null;
  D.scoreNum.textContent = '0';
  D.endOvl.classList.add('hidden');
  D.startOvl.classList.add('hidden');
  getAudioCtx();          // unlock audio context on user gesture
  startBackgroundMusic();
  loadQuestion();
}

/* ============================================================
   HEAD-TILT DETECTION  (MediaPipe Face Mesh)
   ─────────────────────────────────────────────────────────
   Roll angle = −atan2(dy, dx) where landmarks 33 (left eye) 
   and 263 (right eye) form the reference line.
   Negated because the webcam is CSS-mirrored (scaleX(-1)).

   rollDeg < −THRESHOLD → head tilts LEFT  → Card A
   rollDeg >  THRESHOLD → head tilts RIGHT → Card B
   |rollDeg| < THRESHOLD → neutral, no selection
============================================================ */
function initFaceMesh() {
  const fm = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`,
  });
  fm.setOptions({
    maxNumFaces:            1,
    refineLandmarks:        false,
    minDetectionConfidence: 0.6,
    minTrackingConfidence:  0.6,
  });
  fm.onResults(onFaceResults);
  return fm;
}

function onFaceResults(res) {
  if (!state.gameActive || state.answerLocked) { clearHighlight(); return; }
  if (!res.multiFaceLandmarks?.length) {
    D.statusMsg.textContent = '👀 Look at the camera!';
    clearHighlight(); clearRing();
    state.holdStart = null; state.tiltSide = null;
    return;
  }
  D.statusMsg.textContent = 'Tilt your head to choose!';
  const lm   = res.multiFaceLandmarks[0];
  const lEye = lm[33]; const rEye = lm[263];
  const dx   = rEye.x - lEye.x;
  const dy   = rEye.y - lEye.y;
  const roll = -Math.atan2(dy, dx) * (180 / Math.PI); // negated for mirror

  const thr = CONFIG.TILT_THRESHOLD_DEG;
  let side  = null;
  if (roll < -thr) side = 'a';
  else if (roll > thr) side = 'b';

  D.cardA.classList.toggle('highlight', side === 'a');
  D.cardB.classList.toggle('highlight', side === 'b');

  const now = performance.now();
  if (side && side === state.tiltSide) {
    if (state.holdStart === null) state.holdStart = now;
    const elapsed = now - state.holdStart;
    setRing(elapsed / CONFIG.HOLD_DURATION_MS);
    if (elapsed >= CONFIG.HOLD_DURATION_MS) confirmAnswer(side);
  } else {
    state.tiltSide  = side;
    state.holdStart = side ? now : null;
    clearRing();
  }
}
function clearHighlight() {
  D.cardA.classList.remove('highlight');
  D.cardB.classList.remove('highlight');
}

/* ============================================================
   WEBCAM SETUP
============================================================ */
async function setupWebcam(fm) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width:{ideal:320}, height:{ideal:320} },
      audio: false,
    });
    D.webcam.srcObject = stream;
    await new Promise(r => { D.webcam.onloadedmetadata = r; });
    const cam = new Camera(D.webcam, {
      onFrame: async () => { await fm.send({ image: D.webcam }); },
      width:320, height:320,
    });
    cam.start();
    D.statusMsg.textContent = '📷 Camera ready!';
  } catch (err) {
    console.warn('Webcam:', err.message);
    D.camErr.style.display = 'flex';
    D.statusMsg.textContent = 'No camera — click cards or use ← → keys!';
    setupFallback();
  }
}

function setupFallback() {
  window.addEventListener('keydown', e => {
    if (!state.gameActive || state.answerLocked) return;
    if (e.key==='ArrowLeft'||e.key==='a'||e.key==='A') confirmAnswer('a');
    if (e.key==='ArrowRight'||e.key==='d'||e.key==='D') confirmAnswer('b');
  });
  [D.cardA, D.cardB].forEach(c => {
    c.style.cursor = 'pointer';
    c.addEventListener('click', () => {
      if (state.answerLocked || !state.gameActive) return;
      getAudioCtx();
      confirmAnswer(c.id === 'card-a' ? 'a' : 'b');
    });
  });
}

/* ============================================================
   INIT
============================================================ */
async function init() {
  const fm = initFaceMesh();
  setupWebcam(fm).catch(console.warn);
  await new Promise(r => setTimeout(r, 1400));  // wait for WASM
  $('loading-screen').classList.add('hidden');
  D.btnStart.addEventListener('click',  startGame);
  D.btnReplay.addEventListener('click', startGame);
  resizeConfetti();
}

init();
</script>
